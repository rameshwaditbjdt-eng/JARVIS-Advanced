
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Android speech libraries
        run: |
          mkdir -p /tmp/sherpa-android
          mkdir -p app/src/main/jniLibs/arm64-v8a

          curl -fL \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2 \
            -o /tmp/sherpa-android.tar.bz2

          tar -xjf /tmp/sherpa-android.tar.bz2 \
            -C /tmp/sherpa-android

          cp /tmp/sherpa-android/jniLibs/arm64-v8a/*.so \
            app/src/main/jniLibs/arm64-v8a/

      - name: Download offline English command model
        run: |
          mkdir -p app/src/main/assets/asr

          curl -fL \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17.tar.bz2 \
            -o /tmp/jarvis-asr-model.tar.bz2

          tar -xjf /tmp/jarvis-asr-model.tar.bz2 \
            -C app/src/main/assets/asr

          test -f app/src/main/assets/asr/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17/encoder-epoch-99-avg-1.int8.onnx
          test -f app/src/main/assets/asr/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17/tokens.txt

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
